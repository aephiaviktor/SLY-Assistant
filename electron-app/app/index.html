<!doctype html>
<html>
 <head>
    <meta charset="UTF-8">
    <title>SLYA</title>
    <link rel="stylesheet" href="roboto.css">
    <style>
	html { webkit-font-smoothing: antialiased; box-sizing: border-box; text-size-adjust: 100%; }
    table, body { font-family:Roboto,sans-serif; font-weight:inherit; font-size:inherit; font-size:12px; font-weight:bold; letter-spacing: 0.00938em; } 
    *, ::before, ::after { box-sizing: inherit; } 
    body { margin:0; padding:0; background-color:black; color:white; font-size:18px; line-height:1.5;  }
    </style>
 </head>
 <body>

<script>

const urlParams = new URLSearchParams(window.location.search);
const version = urlParams.get('version');
const aephiaVersion = urlParams.get('aephiaVersion');
const appInstanceName = urlParams.get('appInstanceName') || '';
const loadingVersionLabel = aephiaVersion && aephiaVersion !== 'unknown' ? (appInstanceName + ' - AEP v' + aephiaVersion) : (appInstanceName + ' - SLYA v' + version);
window.GM_info = { script: { version: version, aephiaVersion: aephiaVersion } };

</script>

	<div style="position:absolute;top:50vh;left:0px;text-align:center;width:100%;z-index:-1;font-size:120%;" id="wait"><script>if(version) { document.write('Loading '+loadingVersionLabel); setTimeout('document.getElementById("wait").remove();', 8000); } else document.write('Loading the latest '+appInstanceName+' - AEP version from GitHub'); </script> ... please wait.</div>
	<div style="position:absolute;right:5px;top:0;">
		<button class="assist-btn" onclick="window.electronAPI.openDevTools()">Console</button>
		<button id="updateBtn" class="assist-btn" onclick="window.electronAPI.openUpdate()">Update</button>
		<button class="assist-btn" onclick="window.location.reload()">Reload</button>
	</div>	
	
<div id="wallet-key-warning" style="display:none;position:absolute;top:36vh;left:0px;text-align:center;width:100%;z-index:-1;font-size:90%;color:#ffb;"></div>
<script>
	(async () => {
		if(!version || !window.electronAPI?.getWalletSecretStatus) return;
		const warning = document.getElementById('wallet-key-warning');
		try {
			const status = await window.electronAPI.getWalletSecretStatus();
			if(status?.configured && !status?.error) return;
			if(status?.error) warning.textContent = 'The encrypted wallet key could not be loaded: ' + String(status.error);
			else warning.innerHTML = 'This SLYA standalone version needs your wallet key to sign transactions.<br>Open Tools &gt; Settings &gt; Advanced &gt; My Secret Key and follow the instructions.<br>After saving the key, use the top-right Reload button.';
			warning.style.display = 'block';
		} catch(error) {
			warning.textContent = 'Could not check the encrypted wallet key: ' + String(error?.message || error);
			warning.style.display = 'block';
		}
	})();
</script>
<script src="GM.js" type="text/javascript"></script>
<script src="index.iife.min.js" type="text/javascript"></script>
<script src="anchor-browserified.js" type="text/javascript"></script>
<script src="buffer-browserified.js" type="text/javascript"></script>
<script src="bs58-browserified.js" type="text/javascript"></script>
<script src="SLY_Assistant.user.js" type="text/javascript"></script>

  </body>
</html>
